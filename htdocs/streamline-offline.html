<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0e14">
  <title>Router indisponível</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#090b11;color:#f7f7fb}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 70% 0,rgba(139,92,246,.16),transparent 28rem),#090b11}.card{width:min(420px,calc(100% - 32px));padding:28px;border:1px solid #29303d;border-radius:16px;background:#11151d;box-shadow:0 24px 70px #0008}.logo{width:54px;height:54px;margin-bottom:18px}h1{font-size:1.35rem;margin:0 0 10px}p{color:#929bb0;line-height:1.55;margin:0 0 20px}button{width:100%;padding:11px;border:0;border-radius:9px;background:linear-gradient(135deg,#8b5cf6,#6d3de1);color:white;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/luci-static/streamline/logo.svg" alt="">
    <h1>Não foi possível contactar o router</h1>
    <p>Confirme que está ligado à rede local ou à VPN do router e tente novamente. Nenhuma página de configuração é guardada offline.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
